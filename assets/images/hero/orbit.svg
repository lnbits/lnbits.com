<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" fill="none">
  <defs>
    <linearGradient id="arc" x1="0" y1="480" x2="470" y2="265" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ba4be8" stop-opacity=".65"/>
      <stop offset=".35" stop-color="#ef70e4"/>
      <stop offset="1" stop-color="#9b39cd" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="outside-horizon">
      <path d="M-160 0H900V265H470C245 270 80 360 -50 550H-160Z"/>
    </clipPath>
    <filter id="inner-glow" x="-160" y="140" width="820" height="560" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-160" y="140" width="820" height="560" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <!-- A faint rim glow crosses the horizon; the softer atmosphere stays mostly outside. -->
  <path d="M-50 550C80 360 245 270 470 265" stroke="url(#arc)" stroke-width="32" opacity=".14" filter="url(#inner-glow)"/>
  <g clip-path="url(#outside-horizon)">
    <path d="M-50 550C80 360 245 270 470 265" transform="translate(-8 -14)" stroke="url(#arc)" stroke-width="70" opacity=".3" filter="url(#glow)"/>
  </g>
  <path d="M-50 550C80 360 245 270 470 265" stroke="url(#arc)" stroke-width="1.5" opacity=".75"/>
</svg>
